name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gdb
      - run: rustup toolchain install stable --profile minimal && rustup target add x86_64-unknown-linux-musl
      - run: cargo build -p hexcavator --target x86_64-unknown-linux-musl
      - run: cargo build -p hexcavator
      - name: Diagnose
        run: |
          python3 diag/damage.py testdata/init/init-x86_64-linux-gnu /tmp/a
          python3 diag/damage.py testdata/elf/program-x86_64-linux-gnu /tmp/b
          for f in /tmp/a /tmp/b; do
            echo "=== glibc $f"
            start=$(date +%s.%N); timeout 60 target/debug/hexcavator init -json $f > /dev/null 2>/tmp/err; echo "code $? in $(echo "$(date +%s.%N) - $start" | bc) s"; tail -3 /tmp/err
            echo "=== musl $f"
            start=$(date +%s.%N)
            target/x86_64-unknown-linux-musl/debug/hexcavator init -json $f > /dev/null 2>/tmp/err &
            pid=$!
            sleep 6
            if kill -0 $pid 2>/dev/null; then
              grep -E "VmSize|VmRSS|Threads" /proc/$pid/status
              sudo gdb -p $pid -batch -ex "thread apply all bt 25" 2>&1 | grep -E "^#|^Thread" | head -120
              kill $pid
            fi
            wait $pid; echo "code $? in $(echo "$(date +%s.%N) - $start" | bc) s"; tail -3 /tmp/err
          done
