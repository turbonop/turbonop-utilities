name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest      # x64
          - windows-11-arm      # arm64
          - ubuntu-latest       # x64
          - macos-15            # arm64 (Apple silicon)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets
      # Every platform's dependencies, not only this host's: the licenses
      # test lists them all (cargo metadata --offline).
      - run: cargo fetch
      # (Every test binary at once: see apps/xtask.)
      - run: cargo xtask test

  # Hosts without memory mapping (WebAssembly) read files into memory
  # instead; check that everything still builds for one.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup target add wasm32-wasip1 wasm32-wasip1-threads
      - run: cargo clippy --workspace --target wasm32-wasip1
      # (The web version's: threads, as Web Workers.)
      - run: cargo clippy -p hexcavator --target wasm32-wasip1-threads

  # The web version (editors/web): hexcavator for wasi-threads, in a
  # headless Edge, as the page runs it and as a person uses the page.
  web:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add wasm32-wasip1-threads
      - run: cargo build --release -p hexcavator --target wasm32-wasip1-threads
        env:
          RUSTFLAGS: -C link-arg=--max-memory=4294967296
      - shell: bash
        run: |
          npm pack @vscode/codicons@0.0.36
          mkdir codicons && tar -xzf vscode-codicons-0.0.36.tgz -C codicons
      - run: python editors/web/test/run.py --wasm target/wasm32-wasip1-threads/release/hexcavator.wasm --codicons codicons/package/dist

  # Linux releases are static, with musl: the tests, built so (with
  # mimalloc, every program's allocator, compiled with musl-gcc).
  musl:
    runs-on: ubuntu-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo fetch
      - run: cargo xtask test --target x86_64-unknown-linux-musl

  # The fuzzer: its self-test (each kind of failure caught), then two
  # minutes over every target (blind; the nightly run is guided).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo build --release -p turbonop-fuzz
      - run: target/release/turbonop-fuzz selftest
      - run: target/release/turbonop-fuzz run all -seconds 120 -batch 500
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: fuzz-findings/

  # The VS Code extension: its helpers' tests (with hexcavator for the sidebar's
  # tree), and, on Windows, the views rendered in headless Edge.
  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build --release -p hexcavator
      - shell: bash
        working-directory: editors/vscode/hexcavator
        run: |
          exe=$PWD/../../../target/release/hexcavator
          if [ -f "$exe.exe" ]; then exe=$exe.exe; fi
          for t in test/*.test.js; do node "$t" "$exe" || exit 1; done
      - if: runner.os == 'Windows'
        run: python editors/vscode/hexcavator/test/harness.py target/release/hexcavator.exe testdata/xref/xref-x64.exe testdata/xref/xref-x64-renamed.exe
      # Dump Analyzer's debug adapter session: with canned answers, and with
      # dump-analyzer serve on the repository's dumps.
      - run: cargo build --release -p dump-analyzer
      - shell: bash
        working-directory: editors/vscode/dump-analyzer
        run: node --test test/*.test.js

  # The Stackrabbit extension: its framing and tree model, and a session
  # with the engine on a synthetic trace.
  vscode-stackrabbit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build --release -p stackrabbit
      - shell: bash
        working-directory: editors/vscode/stackrabbit
        run: |
          exe=$PWD/../../../target/release/stackrabbit
          if [ -f "$exe.exe" ]; then exe=$exe.exe; fi
          for t in test/*.test.js; do node "$t" "$exe" || exit 1; done
      - if: runner.os == 'Windows'
        run: python editors/vscode/stackrabbit/test/harness.py target/release/stackrabbit.exe

  # Procupine's VS Code extension: its model's and server client's tests
  # (with procupine, on each platform), and, on Windows, the view rendered
  # in headless Edge with real samples.
  vscode-procupine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build --release -p procupine
      - shell: bash
        working-directory: editors/vscode/procupine
        run: |
          exe=$PWD/../../../target/release/procupine
          if [ -f "$exe.exe" ]; then exe=$exe.exe; fi
          for t in test/*.test.js; do node "$t" "$exe" || exit 1; done
      - if: runner.os == 'Windows'
        run: python editors/vscode/procupine/test/harness.py target/release/procupine.exe
