[workspace]
resolver = "3"
members = ["crates/*/*", "apps/*"]

[workspace.package]
version = "0.0.7"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["James McNellis <james@jamesmcnellis.com>"]
repository = "https://github.com/turbonop/turbonop-utilities"

[workspace.dependencies]
# Third-party (see the dependency policy: only complex, non-core utilities).
# Regular expressions are users' (filters, bloaty's custom data sources:
# RE2's syntax): Unicode's categories (\pL) and scripts (\p{Greek}), as
# RE2 has, and its \w, \d, \s, \b, and case folding; not its ages,
# segmentation, or other properties (\p{Alphabetic}), which RE2 lacks
# (158 KB of tables).
regex = { version = "1.13", default-features = false, features = [
    "std",
    "perf",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
    "unicode-script",
] }
miniz_oxide = "0.9"
ruzstd = "0.8"
# xz (ELF MiniDebugInfo): LZMA2 only; the xz container is ours. No
# `optimization` (its unsafe code and assembly), no encoder.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std"] }
# Cryptography (never ours): hashes and signature verification only.
sha1 = { version = "0.11", default-features = false, features = ["oid"] }
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
md-5 = { version = "0.11", default-features = false, features = ["oid"] }
rsa = { version = "0.10", default-features = false, features = ["std", "pkcs1v15"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
memmap2 = "0.9"
# O_NONBLOCK, to open a path a file names without blocking on a FIFO
# (already in the build: memmap2's on Unix).
libc = { version = "0.2", default-features = false }
bumpalo = "3.20"
rustc-hash = "2.1"
# A NUL or byte found with SIMD (already in the build: regex's).
memchr = { version = "2.8", default-features = false }
# The allocator of every native program and test (turbonop-global-alloc).
# mimalloc 2 (the crate's default is 3): 3.3.2 crashes on Windows and macOS
# reallocating a block another thread allocated (a String made on one
# thread and grown on another: turbonop-par's map_into test).
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
# Its C library, for its options (`mi_option_set`, in `extended`).
libmimalloc-sys = { version = "0.1", default-features = false, features = ["v2", "extended"] }
turbonop-alloc = { path = "crates/base/alloc" }
turbonop-global-alloc = { path = "crates/base/global-alloc" }
turbonop-core = { path = "crates/base/core" }
turbonop-mmap = { path = "crates/base/mmap" }
turbonop-par = { path = "crates/base/par" }
turbonop-hash = { path = "crates/base/hash" }
turbonop-mz = { path = "crates/formats/mz" }
turbonop-ne = { path = "crates/formats/ne" }
turbonop-lx = { path = "crates/formats/lx" }
turbonop-archive = { path = "crates/formats/archive" }
turbonop-linkerlog = { path = "crates/formats/linkerlog" }
turbonop-linkmap = { path = "crates/formats/linkmap" }
turbonop-elf = { path = "crates/formats/elf" }
turbonop-elf-object = { path = "crates/formats/elf-object" }
turbonop-dwarf = { path = "crates/symbols/dwarf" }
turbonop-macho = { path = "crates/formats/macho" }
turbonop-macho-object = { path = "crates/formats/macho-object" }
turbonop-wasm = { path = "crates/formats/wasm" }
turbonop-wasm-isa = { path = "crates/isa/wasm" }
turbonop-pe = { path = "crates/formats/pe" }
turbonop-coff = { path = "crates/formats/coff" }
turbonop-moduledef = { path = "crates/formats/moduledef" }
turbonop-fold = { path = "crates/link/fold" }
turbonop-linker = { path = "crates/link/linker" }
turbonop-pdb-write = { path = "crates/symbols/pdb-write" }
turbonop-verify = { path = "crates/link/verify" }
turbonop-signature = { path = "crates/formats/signature" }
turbonop-image = { path = "crates/formats/image" }
turbonop-debuginfo = { path = "crates/symbols/debuginfo" }
turbonop-size = { path = "crates/analysis/size" }
turbonop-x86 = { path = "crates/isa/x86" }
turbonop-arm64 = { path = "crates/isa/arm64" }
turbonop-arm32 = { path = "crates/isa/arm32" }
turbonop-riscv = { path = "crates/isa/riscv" }
turbonop-loongarch = { path = "crates/isa/loongarch" }
turbonop-powerpc = { path = "crates/isa/powerpc" }
turbonop-mips = { path = "crates/isa/mips" }
turbonop-tablegen = { path = "crates/isa/tablegen" }
turbonop-codeview = { path = "crates/symbols/codeview" }
turbonop-pdb = { path = "crates/symbols/pdb" }
turbonop-demangle = { path = "crates/symbols/demangle" }
turbonop-xref = { path = "crates/analysis/xref" }
turbonop-deps = { path = "crates/analysis/deps" }
turbonop-fingerprint = { path = "crates/analysis/fingerprint" }
turbonop-query = { path = "crates/analysis/query" }
turbonop-code = { path = "crates/analysis/code" }
turbonop-program = { path = "crates/analysis/program" }
turbonop-etl = { path = "crates/formats/etl" }
turbonop-etw = { path = "crates/trace/etw" }
turbonop-trace = { path = "crates/trace/trace" }
turbonop-trace-analysis = { path = "crates/trace/trace-analysis" }
turbonop-symbolize = { path = "crates/symbols/symbolize" }
turbonop-trace-synth = { path = "crates/trace/trace-synth" }
turbonop-abi = { path = "crates/debug/abi" }
turbonop-unwind = { path = "crates/debug/unwind" }
turbonop-minidump = { path = "crates/formats/minidump" }
turbonop-target = { path = "crates/debugger/target" }
turbonop-frames = { path = "crates/debugger/frames" }
turbonop-eval = { path = "crates/debugger/eval" }
turbonop-paths = { path = "crates/debugger/paths" }
turbonop-process = { path = "crates/system/process" }

[workspace.lints.rust]
# `unsafe` is confined to a few audited spots (Pod casts, mmap FFI) that opt in
# with a crate- or item-level `allow`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Target-derived sizes must be converted explicitly and checked.
cast_possible_truncation = "warn"
# A curated part of the pedantic group: lints that make code clearer and
# that the code follows (the rest of the group is too noisy to keep
# clean, or argues with deliberate style: `must_use_candidate`,
# `missing_errors_doc`, `doc_markdown`, `similar_names`, ...).
cast_lossless = "warn"
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
if_not_else = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"

# Everything is built optimized, tests included: what they decode runs to
# millions of instructions and symbols, which unoptimized code is ten times
# and more slower at. The development profile keeps its checks: debug
# assertions and integer overflow checks stay on.
[profile.dev]
opt-level = 3
debug-assertions = true
overflow-checks = true
# File and line tables only (backtraces, profilers): full debug info for
# optimized code costs a sixth of a clean build and changes no code. For a
# debugger's view of variables, build `--profile debugging`.
debug = "line-tables-only"

# The development profile with full debug information.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.release]
debug = true
