[package]
name = "dump-analyzer"
description = "Dump Analyzer: post-mortem debugging of crash dumps (Windows, Linux, and macOS minidumps; Linux core files) from the command line, or served to an editor"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dump-analyzer"
path = "src/main.rs"

[dependencies]
turbonop-abi.workspace = true
turbonop-arm64.workspace = true
turbonop-core.workspace = true
turbonop-debuginfo.workspace = true
turbonop-dwarf.workspace = true
turbonop-eval.workspace = true
turbonop-frames.workspace = true
turbonop-mmap.workspace = true
turbonop-program.workspace = true
turbonop-target.workspace = true
turbonop-x86.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
