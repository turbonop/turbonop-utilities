[package]
name = "turbonop-fuzz"
description = "Hexcavator's fuzzer: every parser and command, on mutated inputs, for crashes, hangs, and blowups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# (No unit tests: their build of the crate would be wasted. The hexcavator
# tests check that a target marked so has none.)
[lib]
test = false

[[bin]]
name = "turbonop-fuzz"
path = "src/main.rs"
test = false

[dependencies]
hexcavator = { path = "../hexcavator" }
turbonop-arm64.workspace = true
turbonop-arm32.workspace = true
turbonop-wasm.workspace = true
turbonop-code.workspace = true
turbonop-debuginfo.workspace = true
turbonop-image.workspace = true
turbonop-demangle.workspace = true
turbonop-elf.workspace = true
turbonop-etl.workspace = true
turbonop-etw.workspace = true
turbonop-trace.workspace = true
turbonop-trace-analysis.workspace = true
turbonop-linkerlog.workspace = true
turbonop-linkmap.workspace = true
turbonop-macho.workspace = true
turbonop-mz.workspace = true
turbonop-ne.workspace = true
turbonop-lx.workspace = true
turbonop-pdb.workspace = true
turbonop-pe.workspace = true
turbonop-query.workspace = true
turbonop-signature.workspace = true
turbonop-size.workspace = true
turbonop-target.workspace = true
turbonop-x86.workspace = true
turbonop-riscv.workspace = true
turbonop-loongarch.workspace = true
turbonop-powerpc.workspace = true
turbonop-mips.workspace = true

[features]
# Coverage-guided fuzzing: build with RUSTFLAGS="-C instrument-coverage"
# too (see README.md); the child reads LLVM's profiling counters.
coverage = []

[lints]
workspace = true
