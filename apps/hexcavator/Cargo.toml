[package]
name = "hexcavator"
description = "hexcavator: explore executables, objects, and libraries and their debug information (PE, ELF, Mach-O, WebAssembly; PDB, DWARF) from the command line, or serve it to editors and AI agents"
version = "0.0.9"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hexcavator"
path = "src/main.rs"

[dependencies]
turbonop-codeview.workspace = true
regex.workspace = true
turbonop-core.workspace = true
turbonop-mmap.workspace = true
turbonop-mz.workspace = true
turbonop-par.workspace = true
turbonop-hash.workspace = true
turbonop-pe.workspace = true
turbonop-signature.workspace = true
turbonop-x86.workspace = true
turbonop-arm64.workspace = true
turbonop-pdb.workspace = true
turbonop-dwarf.workspace = true
turbonop-demangle.workspace = true
turbonop-image.workspace = true
turbonop-macho.workspace = true
turbonop-ne.workspace = true
turbonop-lx.workspace = true
turbonop-debuginfo.workspace = true
turbonop-deps.workspace = true
turbonop-wasm.workspace = true
turbonop-elf.workspace = true
rustc-hash.workspace = true
turbonop-size.workspace = true
turbonop-archive.workspace = true
turbonop-linkerlog.workspace = true
turbonop-linkmap.workspace = true
turbonop-xref.workspace = true
turbonop-query.workspace = true
turbonop-program.workspace = true
serde.workspace = true
serde_json.workspace = true

# (Linux releases are static, with musl: see src/main.rs.)
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true

# (WebAssembly's threads: see src/main.rs.)
[target.'cfg(target_family = "wasm")'.dependencies]
turbonop-alloc.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
