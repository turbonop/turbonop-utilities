[package]
name = "hexcavator"
description = "hexcavator: explore executables, objects, and libraries and their debug information (PE, ELF, Mach-O, WebAssembly; PDB, DWARF) from the command line, or serve it to editors and AI agents"
version = "0.0.11"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hexcavator"
path = "src/main.rs"

# cargo-binstall: the release's program for the target, as it is (see
# .github/workflows/hexcavator-release.yml): `cargo binstall hexcavator`,
# or `cargo binstall --git https://github.com/turbonop/turbonop-utilities
# hexcavator`. Linux's are static (musl): any distribution's, glibc's too.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/hexcavator-v{ version }/hexcavator-{ target }{ binary-ext }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/hexcavator-v{ version }/hexcavator-x86_64-unknown-linux-musl"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/hexcavator-v{ version }/hexcavator-aarch64-unknown-linux-musl"


[dependencies]
turbonop-global-alloc.workspace = true
turbonop-codeview.workspace = true
regex.workspace = true
turbonop-core.workspace = true
turbonop-mmap.workspace = true
turbonop-mz.workspace = true
turbonop-par.workspace = true
turbonop-hash.workspace = true
turbonop-pe.workspace = true
turbonop-clr.workspace = true
turbonop-java.workspace = true
turbonop-zip.workspace = true
turbonop-signature.workspace = true
turbonop-x86.workspace = true
turbonop-arm64.workspace = true
turbonop-pdb.workspace = true
turbonop-dwarf.workspace = true
turbonop-demangle.workspace = true
turbonop-image.workspace = true
turbonop-macho.workspace = true
turbonop-ne.workspace = true
turbonop-lx.workspace = true
turbonop-debuginfo.workspace = true
turbonop-deps.workspace = true
turbonop-wasm.workspace = true
turbonop-elf.workspace = true
rustc-hash.workspace = true
miniz_oxide.workspace = true
turbonop-size.workspace = true
turbonop-archive.workspace = true
turbonop-linkerlog.workspace = true
turbonop-linkmap.workspace = true
turbonop-xref.workspace = true
turbonop-query.workspace = true
turbonop-program.workspace = true
serde.workspace = true
serde_json.workspace = true

# (build.rs: THIRD_PARTY_NOTICES.txt, compressed for `hexcavator licenses`.)
[build-dependencies]
miniz_oxide.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
