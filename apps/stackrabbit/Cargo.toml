[package]
name = "stackrabbit"
description = "Stackrabbit: a fast performance trace viewer's engine; opens ETW traces and answers an editor's queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"
# (No unit tests: the integration tests drive the library and the binary.)
test = false

[[bin]]
name = "stackrabbit"
path = "src/main.rs"
test = false

[dependencies]
turbonop-core.workspace = true
turbonop-mmap.workspace = true
turbonop-etl.workspace = true
turbonop-etw.workspace = true
turbonop-trace.workspace = true
turbonop-trace-analysis.workspace = true
turbonop-trace-synth.workspace = true
turbonop-symbolize.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true

[dev-dependencies]
turbonop-pdb.workspace = true

[lints]
workspace = true
