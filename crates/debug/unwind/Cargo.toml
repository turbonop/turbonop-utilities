[package]
name = "turbonop-unwind"
description = "Virtual stack unwinders: recover a caller's registers from a frame's registers, its stack, and the image's unwind data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 AND Apache-2.0 WITH LLVM-exception"
authors.workspace = true
repository.workspace = true

# (No unit tests: their build of the crate would be wasted. The workspace's
