turbonop-core.workspace = true
turbonop-debuginfo.workspace = true
turbonop-dwarf.workspace = true
turbonop-frames.workspace = true
turbonop-target.workspace = true

[dev-dependencies]
turbonop-program.workspace = true

[lints]
workspace = true
