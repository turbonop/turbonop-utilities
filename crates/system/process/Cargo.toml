[package]
name = "turbonop-process"
description = "The processes running on this machine, as a process explorer shows them: a snapshot of each with its counters and details, rates between snapshots, and killing, suspending, and resuming them (Windows, Linux, macOS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
rustc-hash.workspace = true

# (What the platforms with collectors use.)
[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
turbonop-par.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[dev-dependencies]
turbonop-global-alloc.workspace = true
