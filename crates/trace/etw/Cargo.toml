[package]
name = "turbonop-etw"
description = "Decoders for Windows kernel and trace-control events in ETL files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# (No unit tests: their build of the crate would be wasted. The workspace's
# tests check that a target marked so has none.)
[lib]
test = false

[dependencies]
turbonop-core.workspace = true
turbonop-etl.workspace = true
turbonop-pe.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
turbonop-mmap.workspace = true

[lints]
workspace = true

# (Tests allocate with mimalloc, as the programs do.)
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
mimalloc.workspace = true
